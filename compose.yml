services:
  app:
    build:
      context: .
      args:
        STINGRAYTOOLS_REF: main
        STINGRAYTOOLS_REPO: https://github.com/anhph95/stingraytools.git
    container_name: stingray-dashboard

    ports:
      - "${STINGRAY_DASHBOARD_PORT:-8050}:8050"

    volumes:
      - type: bind
        source: ${DASH_DATA_DIR:-./dash_data}
        target: /dash_data
        read_only: true

    environment:
      PYTHONUNBUFFERED: "1"
      STINGRAY_DASHBOARD_PORT: "${STINGRAY_DASHBOARD_PORT:-8050}"
      STINGRAY_DEFAULT_DATASET: "${STINGRAY_DEFAULT_DATASET:-}"

    restart: unless-stopped
