[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stingraytools"
version = "2.0.0"
description = "NES-LTER Stingray data processing, visualization, and dashboard tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Anh Pham" },
    { name = "Sidney Batchelder" },
    { name = "Heidi Sosik" },
]
keywords = [
    "NES-LTER",
    "Stingray",
    "ISIIS",
    "oceanography",
    "sensor-processing",
    "dashboard",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = [
    "dash>=3",
    "matplotlib>=3.8",
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=5",
    "PyYAML>=6",
    "scipy>=1.11",
    "tqdm>=4.64",
]

[project.urls]
Homepage = "https://github.com/anhph95/StingrayTools"
Repository = "https://github.com/anhph95/StingrayTools"
Issues = "https://github.com/anhph95/StingrayTools/issues"

[project.scripts]
stingray = "stingray.cli.main:main"
stingray-dashboard = "stingray_dashboard.app:main"

[project.optional-dependencies]
dev = [
    "jupyter>=1",
    "ipykernel>=6.29",
    "pytest>=8",
]

server = [
    "gunicorn>=21; platform_system != 'Windows'",
]

shadowgraph = [
    "opencv-python",
    "tator",
]

all = [
    "gunicorn>=21; platform_system != 'Windows'",
    "ipykernel>=6.29",
    "jupyter>=1",
    "opencv-python",
    "pytest>=8",
    "tator",
]

[tool.setuptools]
include-package-data = true
packages = [
    "ctdtools",
    "stingray",
    "stingray.cli",
    "stingray.config",
    "stingray.images",
    "stingray.io",
    "stingray.logging",
    "stingray.profiles",
    "stingray.sensors",
    "stingray.stats",
    "stingray.utils",
    "stingray_dashboard",
]

[tool.setuptools.package-dir]
ctdtools = "packages/ctdtools/src/ctdtools"
stingray = "packages/stingraytools/src/stingray"
stingray_dashboard = "packages/stingray-dashboard/src/stingray_dashboard"

[tool.setuptools.package-data]
stingray = [
    "data_reference/*",
]
stingray_dashboard = [
    "assets/*",
    "data_reference/*",
]
