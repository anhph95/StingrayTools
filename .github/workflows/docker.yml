name: Publish dashboard container

on:
  # Publish the rolling image whenever the production branch changes.
  push:
    branches:
      - main
    tags:
      - "v*"

  # Allow an authorized maintainer to rebuild the image manually.
  workflow_dispatch:

# Prevent overlapping publishes for the same branch or tag.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Read the repository source and publish packages owned by the repository.
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Check out the exact commit represented by the image.
      - name: Check out source
        uses: actions/checkout@v4

      # Authenticate with GitHub Container Registry using the workflow token.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate rolling, immutable commit, and semantic-version image tags.
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anhph95/stingray-dashboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the release Dockerfile and publish all generated tags and labels.
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
